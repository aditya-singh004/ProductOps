name: ProductOps CI

on:
  push:
  pull_request:

jobs:
  rails:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: productops
          POSTGRES_PASSWORD: productops_password
          POSTGRES_DB: productops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: rails-app
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://productops:productops_password@localhost:5432/productops_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.4"
          working-directory: rails-app
      - run: rm -f Gemfile.lock && bundle install
      - run: bundle exec rails db:create db:migrate
      - run: bundle exec rails test

  java-risk-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk-engine-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn test

  ant-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-build-module
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get update && sudo apt-get install -y ant
      - run: ant clean test
